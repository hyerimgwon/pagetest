{% assign alumni = include.member %}

<article class="alumni-card">
  <h3 class="alumni-name">{{ alumni.name }}</h3>

  <div class="alumni-details">
    {% if alumni.graduation %}
      <p>{{ alumni.graduation }}</p>
    {% endif %}
    {% if alumni.links.email %}
      <p><a href="mailto:{{ alumni.links.email }}">{{ alumni.links.email }}</a></p>
    {% endif %}
    {% if alumni.status %}
      <p>{{ alumni.status }}</p>
    {% endif %}
  </div>
</article>
